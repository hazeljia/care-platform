/* 中文迭代：沿用原布局、配色和卡片，只适配中文与地点组件。 */
body{font-family:"Microsoft YaHei","PingFang SC",Arial,sans-serif}
h1,h2,.portal h3,.stepcol h3{font-family:"Songti SC","SimSun",Georgia,serif;letter-spacing:0}
h1{font-size:55px;line-height:1.24}.hero h1{font-size:54px;line-height:1.27}
h2{font-size:34px}.eyebrow{letter-spacing:1.5px}.navlinks,.navright{gap:18px}
.navlinks button,.roles button{white-space:nowrap}.herofoot{flex-wrap:wrap}.cardbottom{flex-wrap:wrap}
.location-fields{margin:0 0 20px;padding:18px;border:1px solid var(--line);border-radius:4px;background:var(--paper);min-width:0}
.location-fields legend{padding:0 7px;font-size:13px;font-weight:600}
.location-row{display:grid;grid-template-columns:1fr 1fr 1fr auto;gap:12px;align-items:end}
.location-row select{background:white}.location-row .btn{white-space:nowrap;padding:10px 14px}
.location-note{margin-top:10px!important;font-size:11px!important}
.cn-searchfields{grid-template-columns:1.2fr 1fr 1fr .9fr auto}
#location-modal{max-width:1080px}.map-layout{display:grid;grid-template-columns:1.45fr 1fr;gap:20px;margin:20px 0}
.china-map{width:100%;height:auto;display:block;fill:none;stroke:none;background:#f5f4ee;border:1px solid var(--line);border-radius:4px}
.map-region{fill:#e5e5d9;stroke:#fbfaf5;stroke-width:.8;vector-effect:non-scaling-stroke;cursor:pointer}
.map-region:hover,.map-region:focus-visible{fill:#bbc7ac;outline:none;stroke:#667957;stroke-width:1.5}
.map-region.selected{fill:#59764e;stroke:#f8f8ef}.map-decoration{fill:#d9ddd0;stroke:#788572;cursor:default;pointer-events:none}
.map-label{font-size:10px;fill:#56634c;stroke:none;text-anchor:middle;dominant-baseline:middle;pointer-events:none;letter-spacing:0}
.map-label.selected{fill:#fff}.map-layout .location-row{grid-template-columns:1fr}.map-layout .location-fields{padding:14px}
#map-city-hints{gap:6px}#map-city-hints .chip{font-size:11px;padding:5px 10px}
.coverage-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:15px 0}
.coverage-grid label,.coverage-all,.checklabel{font-size:13px;display:flex;align-items:center;gap:7px}
input[type="checkbox"]{width:16px;height:16px;margin:0;accent-color:var(--green)}
.photo-fallback{display:grid;place-items:center;min-height:100px;height:100%;font-size:12px;color:var(--muted);position:absolute;inset:0;z-index:0}
.heroimage .photo-fallback{position:static}.image-note{z-index:1}.toast{z-index:20}
@media(max-width:1000px){.nav{gap:12px}.navlinks,.navright{gap:12px}.brand{font-size:27px}.hero h1{font-size:46px}.location-row{grid-template-columns:repeat(3,1fr)}.map-entry{grid-column:1/-1;justify-self:start}.map-layout{grid-template-columns:1.2fr 1fr}}
@media(max-width:760px){.hero h1{font-size:40px}.pageintro h1{font-size:34px;line-height:1.35}h2{font-size:28px}.navright>.textbtn{display:inline-block;font-size:12px}.navright{gap:8px}.navlinks{gap:10px}.searchfields.cn-searchfields{grid-template-columns:1fr 1fr}.map-layout{grid-template-columns:1fr}.map-layout .location-row{grid-template-columns:repeat(3,1fr)}.coverage-grid{grid-template-columns:repeat(2,1fr)}.location-fields{padding:12px}.location-row{gap:8px}.map-layout .location-fields{margin-bottom:10px}.china-map{max-height:390px}.portal h3{font-size:24px}}
@media(max-width:450px){.hero h1{font-size:36px}.nav .brand{font-size:25px}.roles button{font-size:11px;padding:6px}.navright>.textbtn{display:none}.location-row,.map-layout .location-row{grid-template-columns:1fr}.location-row .map-entry{width:100%}.searchfields.cn-searchfields{grid-template-columns:1fr 1fr}.modalfoot{flex-wrap:wrap}.profilehead h2{font-size:26px}.map-layout{gap:12px}.formgrid{grid-template-columns:1fr}.sectionhead .textbtn{white-space:normal}.herofoot{gap:8px}}
.inline-feedback{padding:12px 18px;margin:12px 20px 0;background:var(--light);border-left:3px solid #8a774b;font-size:13px;color:var(--ink)}

<div class="wrap"><header class="nav"><button class="brand" data-view="home" aria-label="Kindred 首页"><span data-icon="leaf"></span>kindred<span style="color:#a2ad91">.</span></button><nav class="navlinks" aria-label="主导航"><button data-view="home">首页</button><button data-view="employer">找服务</button><button data-view="employee">找工作</button><button data-section="services">服务项目</button><button data-section="how">如何使用</button></nav><div class="navright"><div class="roles" aria-label="选择角色"><button data-view="employer">服务需求方</button><button data-view="employee">服务人员</button></div><button class="textbtn" data-auth="登录">登录</button><button class="btn" data-auth="注册">注册</button></div></header></div>
<main id="main"></main>
<footer><div class="wrap footerinner"><button class="brand" data-view="home">kindred.</button><p>贴心的帮助，更从容的每一天。</p><p>全国服务 · 中文原型 · 人员、资质与需求均为模拟</p><span class="demo">原型 / 02</span></div></footer>
<dialog id="modal" aria-labelledby="modal-title"><div class="modalhead"><h2 id="modal-title"></h2><button class="close" aria-label="关闭弹窗">×</button></div><div id="modal-feedback" class="inline-feedback hidden" role="status"></div><div id="modal-content"></div></dialog><div id="toast" class="toast hidden" role="status"></div>

<script>
const icons={leaf:'<path d="M20 3C9 2 3 7 5 14s12 7 15-11Z"/><path d="M4 21 15 9M9 16v-5m0 5h5"/>',care:'<path d="M12 20S2 14 2 8a5 5 0 0 1 10-1 5 5 0 0 1 10 1c0 6-10 12-10 12Z"/>',clean:'<path d="m14 3-6 9m3-3 4 3-7 9-6-4 7-8M17 3v4m-2-2h4m1 7v4m-2-2h4"/>',people:'<circle cx="8" cy="7" r="3"/><path d="M2 20v-3a6 6 0 0 1 12 0v3M16 4a3 3 0 0 1 0 6m2 4a5 5 0 0 1 4 5"/>',hospital:'<rect x="4" y="5" width="16" height="16" rx="2"/><path d="M9 5V2h6v3m-3 5v6m-3-3h6"/>',meal:'<path d="M5 2v7m3-7v7M2 2v7a3 3 0 0 0 6 0M5 12v10M18 2c-4 4-4 10 0 10h2V2Zm2 10v10"/>',home:'<path d="m2 10 10-8 10 8M5 8v13h14V8M9 21v-7h6v7"/>',rehab:'<circle cx="12" cy="4" r="2"/><path d="m5 9 7 2 7-2m-7 2v5m0 0-5 6m5-6 5 6"/>',live:'<path d="M3 18V8m18 10V8M3 15h18M3 10h18v5H3Z"/><rect x="5" y="6" width="5" height="4" rx="1"/>',check:'<path d="m5 12 4 4L19 6"/>',shield:'<path d="m12 2 8 3v7c0 5-8 10-8 10S4 17 4 12V5Z"/><path d="m8 11 3 3 5-5"/>',pin:'<path d="M19 9c0 6-7 13-7 13S5 15 5 9a7 7 0 0 1 14 0Z"/><circle cx="12" cy="9" r="2"/>',star:'<path d="m12 2 3 6 7 1-5 5 1 7-6-3-6 3 1-7-5-5 7-1Z"/>',arrow:'<path d="M4 12h16m-6-6 6 6-6 6"/>',clock:'<circle cx="12" cy="12" r="9"/><path d="M12 6v6l4 2"/>',work:'<rect x="3" y="7" width="18" height="14" rx="2"/><path d="M8 7V3h8v4M3 12h18m-11 0v3h4v-3"/>'};
const icon=n=>`<svg viewBox="0 0 24 24" aria-hidden="true">${icons[n]||icons.care}</svg>`;

const regions=window.CN_REGIONS||[],geo=window.CN_MAP_GEOJSON;
const categories=['老人照护','家庭保洁','生活陪伴','陪诊服务','做饭服务','日常生活协助','康复辅助','住家照护'];
const catIcons=['care','clean','people','hospital','meal','home','rehab','live'];
const photo=id=>`./data/images/${id}.jpg`;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const provinceBy=code=>regions.find(p=>p.code===String(code)||p.adcode===String(code));
const citiesFor=code=>provinceBy(code)?.children||[];

function searchForm(){let employer=view==='employer';return `<form id="search" class="searchbox"><h3>${employer?'你需要什么样的帮助？':'从合适的地点，找到合适的工作。'}</h3>${locationFields('search-location')}<div class="searchfields cn-searchfields"><label>服务类型<select name="service">${opts(categories)}</select></label><label>${employer?`服务日期<input type="date" name="date" min="${today}">`:'服务安排<select name="schedule"><option value="">不限</option><option value="recurring">周期服务</option><option value="once">单次服务</option></select>'}</label><label>${employer?'预算上限':'报酬下限'}（元）<input type="number" min="0" name="pay" placeholder="不限"></label><label>计价方式<select name="unit"><option value="">不限</option><option>小时</option><option>天</option><option>月</option></select></label><button class="btn" type="submit">搜索 ${icon('arrow')}</button></div><p class="small muted" style="margin-top:12px">${employer?'日期按人员每周可用时间筛选；预算按卡片所示计价单位比较。':'报酬按卡片所示计价单位比较；选择计价方式可避免不同单位混用。'} 当前地点：<span id="location-summary">全国</span></p></form>`}
const employeeTabs=[['jobs','找工作'],['applications','申请记录'],['schedule','时间安排'],['messages','消息'],['profile','我的资料'],['reviews','收到的评价']];
const employerTabs=[['professionals','找服务人员'],['requests','我的需求'],['bookings','预约记录'],['messages','消息'],['reviews','服务评价']];
function marketplace(){let emp=view==='employer';return `<div class="wrap workspace"><section class="pageintro"><div class="crumb"><button data-view="home">首页</button> / ${emp?'找服务':'找工作'}</div><div class="titleflex"><div><span class="eyebrow">${emp?'可靠的人，贴心的帮助':'用你的技能，让生活更好'}</span><h1>${emp?'找到适合你和家人的<br>服务人员。':'找到适合你的技能<br>与时间安排的工作。'}</h1><p>${emp?'从居家照护到日常家务，让每一份需求都有合适的回应。':'清晰的服务需求、合适的报酬，以及你能安排的工作时间。'}</p></div>${emp?'<div><button class="btn" data-request>发布需求 '+icon('arrow')+'</button><p style="font-size:11px;margin-top:8px">让合适的服务人员找到你。</p></div>':'<span class="badge">'+icon('pin')+' 全国服务机会</span>'}</div><nav class="dashnav" aria-label="${emp?'服务需求方功能':'服务人员功能'}">${(emp?employerTabs:employeeTabs).map(([id,name])=>`<button ${emp?'data-etab':'data-tab'}="${id}" class="${id===(emp?'professionals':tab)?'active':''}">${name}${id==='applications'&&applied.size?'（'+applied.size+'）':''}</button>`).join('')}</nav></section><div id="workspace-content">${searchForm()}<div class="filterchips">${['',...categories].map(c=>`<button class="chip ${selected===c?'selected':''}" data-filter="${c}">${c||'全部服务'}</button>`).join('')}</div><div class="resultshead"><strong id="result-count">${emp?people.length+'位服务人员':jobs.length+'个工作机会'} · 全国</strong><span class="muted">${emp?'找到安心的照护与帮助':'服务有价值，工作有温度'}</span></div><div class="cards" id="results">${(emp?people:jobs).map(emp?personCard:jobCard).join('')}</div></div></div>`}
function imageFallbacks(){document.querySelectorAll('img').forEach(img=>{img.onerror=()=>{img.style.display='none';if(!img.parentElement.querySelector('.photo-fallback')){const span=document.createElement('span');span.className='photo-fallback';span.textContent='人物照片暂不可用';img.parentElement.appendChild(span)}}})}
function render(){main.innerHTML=view==='home'?home():marketplace();document.querySelectorAll('.roles button').forEach(b=>{b.classList.toggle('active',b.dataset.view===view);b.setAttribute('aria-pressed',String(b.dataset.view===view))});document.querySelectorAll('[data-icon]').forEach(e=>e.innerHTML=icon(e.dataset.icon));imageFallbacks()}
function go(v){view=v;tab='jobs';selected='';render();window.scrollTo({top:0,behavior:'instant'})}
function toast(s){const active=mapModal.open?mapModal:modal.open?modal:null;if(active){const feedback=document.querySelector(mapModal.open?'#location-feedback':'#modal-feedback');feedback.textContent=s;feedback.classList.remove('hidden')}const t=document.querySelector('#toast');t.textContent=s;t.classList.remove('hidden');clearTimeout(toast.timer);toast.timer=setTimeout(()=>t.classList.add('hidden'),3500)}
function open(title,html){document.querySelector('#modal-feedback').classList.add('hidden');document.querySelector('#modal-title').textContent=title;document.querySelector('#modal-content').innerHTML=html;if(!modal.open)modal.showModal();imageFallbacks()}
const footerBtns=html=>`<div class="modalfoot">${html}</div>`;
function profile(id){const p=people.find(p=>p.id===id);open('了解服务人员',`<div class="modalbody"><div class="profilehead"><img src="${photo(p.photo)}" alt="${p.name}"><div><span class="badge">${icon('shield')} 已认证 · 示例资质</span><h2>${p.name}</h2><p>${p.service} · ${p.years}年经验</p><span class="rating">${icon('star')} ${p.rating} · ${p.reviews}条评价</span></div></div><div class="infoline">所在地：${locationText(p.location,true)}<br>${p.rate}元 / ${p.unit} · 已完成${p.done}次服务</div><h3>关于我</h3><p>${p.about}</p><div class="profilegrid"><div class="full"><h3>可服务范围</h3><p>${locationNames(p.location).slice(0,2).filter((n,i,a)=>!i||n!==a[i-1]).join(' · ')}</p>${tags(p.coverage==='all'?['全市可服务']:coverageText(p).split(' / '))}</div><div><h3>服务项目与技能</h3>${tags(p.skills)}<h3>服务经历</h3><p>为当地家庭提供服务${p.years}年，已完成${p.done}次服务，其中有多位持续合作的需求方。</p></div><div><h3>语言</h3><p>${p.languages}</p><h3 style="margin-top:18px">培训与证书</h3><p>${p.cert}</p></div><div class="full"><h3>可用时间</h3><p>${p.time} · 每周以下时间可约：</p><div class="availability">${p.days.map(d=>`<span>${weekdays[d]}</span>`).join('')}</div></div></div><div class="review"><h3>服务评价 · ${p.reviews}条示例</h3><span class="rating">${icon('star')} 5.0 · 陈女士 · 2026年9月</span><p style="margin-top:8px">“守时，沟通耐心，认真了解了我们的需求。整个服务过程让家人很安心，愿意再次预约。”</p></div><div class="review"><span class="rating">${icon('star')} 5.0 · 周先生 · 2026年8月</span><p style="margin-top:8px">“做事细致，约定的事项都有完成，联系和确认时间也很方便。”</p></div></div>${footerBtns(`<button class="btn secondary" data-contact="${p.name}">联系服务人员</button><button class="btn" data-book="${p.id}">预约服务 ${icon('arrow')}</button>`)}`)}
function book(id){const p=people.find(x=>x.id===id);open('预约服务',`<form id="booking-form" data-id="${id}"><div class="modalbody"><div class="infoline">${p.name} · ${p.service} · ${p.rate}元/${p.unit}<br>可用时间：${p.days.map(d=>weekdays[d]).join('、')} · ${p.time}<br>服务范围：${coverageText(p)}</div>${locationFields('booking-location',p.location,true)}<div class="formgrid" style="margin-top:18px"><label class="full">详细地址<input name="address" placeholder="例如：文三路某小区（仅模拟填写）" required></label><label>日期<input type="date" name="date" min="${today}" required></label><label>开始时间<input type="time" name="time" required></label><label>${p.unit==='小时'?'时长（小时）':'服务'+(p.unit==='天'?'天数':'月数')}<input name="duration" type="number" min="1" max="${p.unit==='小时'?12:30}" value="${p.unit==='小时'?3:1}" required></label><label class="full">服务要求<textarea name="notes" placeholder="说说需要什么帮助，以及希望服务人员注意的事项。"></textarea></label></div><p class="small muted" style="margin-top:15px">提交后为待确认的模拟预约；双方确认细节后才开始服务，不收取任何费用。${p.unit==='月'?'住家期间的每日安排与休息需另行协商。':''}</p></div>${footerBtns('<button class="btn" type="submit">提交预约需求 '+icon('arrow')+'</button>')}</form>`)}
function request(){open('发布服务需求',`<form id="request-form"><div class="modalbody"><p style="margin-bottom:20px">描述你的需要，让合适的服务人员找到你。</p>${locationFields('request-location',{},true)}<div class="formgrid" style="margin-top:18px"><label class="full">详细地址<input name="address" required placeholder="例如：文三路某小区（仅模拟填写）"></label><label>服务类型<select name="service" required>${opts(categories,'请选择服务')}</select></label><label>服务对象<input name="recipient" placeholder="例如：父亲，76岁" required></label><label>开始日期<input name="date" type="date" min="${today}" required></label><label>开始时间<input name="time" type="time" required></label><label>时长 / 数量<input name="duration" type="number" min="1" max="30" value="4" required></label><label>计价方式<select name="unit"><option>小时</option><option>天</option><option>月</option></select></label><label>预算（元 / 所选单位）<input name="budget" type="number" min="1" max="100000" placeholder="35" required></label><label>服务安排<select name="frequency"><option value="once">单次服务</option><option value="recurring">周期服务</option></select></label><label class="full">周期安排<input name="days" placeholder="例如：每周一、三、五的下午"></label><label class="full">特殊要求<input name="requirements" placeholder="例如：会说普通话、可协助散步、不吸烟"></label><label class="full">需求描述<textarea name="description" required placeholder="父亲今年76岁，希望每周三个下午有人陪伴聊天和协助散步。"></textarea></label></div></div>${footerBtns('<button class="btn" type="submit">发布需求 '+icon('arrow')+'</button>')}</form>`)}
function success(title,body){document.querySelector('#modal-feedback').classList.add('hidden');document.querySelector('#modal-title').textContent='提交成功';document.querySelector('#modal-content').innerHTML=`<div class="modalbody success">${icon('shield')}<h2>${title}</h2><p>${body}</p><p style="margin-top:15px;font-size:12px">原型演示 · 记录保留在当前页面会话，刷新后重置。</p></div>${footerBtns('<button class="btn" data-close>完成 '+icon('check')+'</button>')}`}
function jobDetail(id){const j=jobs.find(x=>x.id===id);open(j.title,`<div class="modalbody"><span class="badge">${scheduleName(j.schedule)}</span><div class="infoline" style="margin-top:16px">${esc(j.service)} · ${locationText(j.location,true)} · ${j.rate}元/${j.unit}</div><h3>需求描述</h3><p>${esc(j.desc)}</p><div class="profilegrid"><div><h3>服务安排</h3><p>${esc(j.days)} · ${esc(j.time)}<br>每次${j.duration}${j.unit} · 从${esc(j.date)}开始</p></div><div><h3>服务对象与需求方</h3><p>${esc(j.recipient)}<br>由${esc(j.employer)}发布</p></div></div><h3 style="margin-top:25px">所需服务</h3>${tags(j.skills)}${j.requirements?`<h3>特殊要求</h3><p>${esc(j.requirements)}</p>`:''}<p class="small">开始工作前，请与需求方确认详细地址、服务内容和时间。</p></div>${footerBtns(`<button class="btn secondary" data-contact="${esc(j.employer)}">联系需求方</button><button class="btn" data-apply="${id}" ${applied.has(id)?'disabled':''}>${applied.has(id)?'已申请':'申请这份工作'}</button>`)}`)}
function apply(id){applied.add(id);document.querySelectorAll(`[data-apply="${id}"]`).forEach(b=>{b.innerHTML='已申请 '+icon('check');b.disabled=true;b.classList.add('secondary')});toast('申请已提交，可在「服务人员 → 申请记录」查看。');const b=document.querySelector('[data-tab="applications"]');if(b)b.textContent=`申请记录（${applied.size}）`}
function filter(){const form=document.querySelector('#search');if(!form)return;const f=new FormData(form),s=selected||f.get('service'),l=readLocation(form.querySelector('[data-location]')),pay=Number(f.get('pay')),date=f.get('date'),day=date?new Date(date+'T12:00:00').getDay():null;let list=(view==='employer'?people:jobs).filter(x=>(!s||x.service===s||x.skills.includes(s))&&matchesLocation(x,l,view==='employer')&&(!f.get('unit')||x.unit===f.get('unit'))&&(!pay||(view==='employer'?x.rate<=pay:x.rate>=pay))&&(view==='employer'?(day===null||x.days.includes(day)):(!f.get('schedule')||x.schedule===f.get('schedule'))));document.querySelector('#results').innerHTML=list.length?list.map(view==='employer'?personCard:jobCard).join(''):empty('暂时没有符合条件的模拟信息');document.querySelector('#result-count').textContent=`${list.length}${view==='employer'?'位服务人员':'个工作机会'} · ${locationText(l,true)}`;document.querySelectorAll('[data-filter]').forEach(b=>b.classList.toggle('selected',b.dataset.filter===selected));imageFallbacks()}
function contact(name){open('消息',`<div class="modalbody"><p>与<strong>${esc(name)}</strong>的对话</p><div class="infoline" style="margin-top:15px">模拟对话，消息不会发送给任何真实用户。</div><div id="conversation">${messages.filter(m=>m.to===name).map(m=>`<div class="message mine">${esc(m.text)}</div>`).join('')}</div><form id="message-form" data-name="${esc(name)}"><label>消息内容<textarea name="text" placeholder="询问服务内容、时间安排或具体需求……" required></textarea></label><button class="btn" style="margin-top:12px">发送消息 ${icon('arrow')}</button></form></div>`)}
function renderCoverage(){const field=document.querySelector('[data-location="profile-location"]'),l=readLocation(field),list=countiesFor(l.province,l.city),same=l.province===profileDraft.location.province&&l.city===profileDraft.location.city;document.querySelector('#coverage-fields').innerHTML=`<label class="coverage-all"><input type="checkbox" name="allCity" ${same&&profileDraft.coverage==='all'?'checked':''}> 所选城市全市可服务</label><div class="coverage-grid">${list.map(d=>`<label><input type="checkbox" name="coverage" value="${d.code}" ${same&&Array.isArray(profileDraft.coverage)&&profileDraft.coverage.includes(d.code)?'checked':''}> ${d.name}</label>`).join('')}</div><p class="small muted">服务范围在所选城市内多选；全市可服务包含该市全部区县。</p>`}
function dashboard(t,employer=false){let container=document.querySelector('#workspace-content');document.querySelectorAll('.dashnav button').forEach(b=>b.classList.toggle('active',(employer?b.dataset.etab:b.dataset.tab)===t));let body='';
if(t==='applications')body=`<h2>我的申请记录</h2><p class="muted" style="margin-top:12px">关注已申请的工作，等待需求方回复。</p><div class="cards" style="margin-top:25px">${jobs.filter(j=>applied.has(j.id)).map(jobCard).join('')||'<div class="panelbox full">还没有申请记录。找到合适的工作后，点击「申请工作」。</div>'}</div>`;
else if(t==='requests')body=`<h2>我的服务需求</h2>${requests.length?requests.map(j=>`<div class="panelbox"><span class="badge">招募中 · ${scheduleName(j.schedule)}</span><h3 style="margin-top:10px">${esc(j.title)}</h3><p>${locationText(j.location,true)} · ${j.rate}元/${j.unit} · ${esc(j.days)}</p><p>详细地址：${esc(j.address)}</p><p>${esc(j.desc)}</p></div>`).join(''):'<div class="panelbox">发布服务需求后，就可以在这里查看。</div>'}<button class="btn" data-request>发布需求</button>`;
else if(t==='bookings')body=`<h2>我的预约记录</h2>${bookings.length?bookings.map(b=>`<div class="panelbox"><span class="badge">待确认 · 模拟预约</span><h3>${b.name}</h3><p>${esc(b.date)} · ${esc(b.time)} · ${b.duration}${b.unit} · 预计¥${b.total}</p><p>${locationText(b.location,true)} · ${esc(b.address)}</p></div>`).join(''):'<div class="panelbox">向服务人员提交预约需求后，记录会出现在这里。</div>'}`;
else if(t==='schedule')body=`<h2>安排好时间，迎接合适的工作。</h2><p class="muted" style="margin-top:12px">设置你通常可以提供服务的日期。</p><form id="availability-form" class="panelbox"><div class="availability">${[1,2,3,4,5,6,0].map(d=>`<label class="checklabel"><input type="checkbox" name="day" value="${d}" ${availability.includes(d)?'checked':''}> ${weekdays[d]}</label>`).join('')}</div><button class="btn" style="margin-top:20px">保存可用时间</button></form><p class="small muted">目前没有已确认的工作安排，申请需等待需求方回复。</p>`;
else if(t==='profile')body=`<h2>我的服务资料</h2><p class="muted" style="margin-top:12px">展示你的经验，也让需求方知道你能到哪些地方服务。</p><form id="profile-form" class="panelbox"><div class="formgrid"><label>姓名<input name="name" value="${esc(profileDraft.name)}" placeholder="填写姓名" required></label><label>时薪（元）<input type="number" name="rate" min="1" value="${profileDraft.rate}" required></label><label class="full">自我介绍<textarea name="about" placeholder="介绍你的经验与服务技能" required>${esc(profileDraft.about)}</textarea></label></div><h3 style="margin:25px 0 10px">所在地</h3>${locationFields('profile-location',profileDraft.location,true)}<h3 style="margin:25px 0 10px">可服务范围</h3><div id="coverage-fields"></div><button class="btn" style="margin-top:18px">保存资料</button></form><p class="small muted">资料为当前会话中的草稿，首页和搜索列表仍展示独立的模拟人员。</p>`;
else if(t==='reviews')body=employer?`<h2>分享你的服务体验</h2><div class="panelbox"><p class="muted">这里可以体验评价表单。正式平台会在服务完成后开放评价。</p><button class="btn secondary" style="margin-top:18px" data-review>体验评价表单</button></div>`:`<h2>每次用心服务，都会积累信任。</h2><div class="panelbox"><h3>暂时没有评价</h3><p class="muted">完成服务后的评价会出现在这里。人员资料中展示的是模拟评价。</p></div>`;
else if(t==='messages')body=`<h2>先聊一聊，让服务更合拍。</h2><div class="panelbox"><p class="muted">${messages.length?'当前会话已保存'+messages.length+'条模拟消息。':'暂时没有对话。可从人员资料或工作详情联系对方。'}</p>${[...new Set(messages.map(m=>m.to))].map(n=>`<p style="margin-top:15px"><button class="textbtn" data-contact="${esc(n)}">${esc(n)} ${icon('arrow')}</button></p>`).join('')}</div>`;
container.innerHTML=`<section class="dashboardpanel">${body}</section>`;if(t==='profile')renderCoverage()}


function closeOnBackdrop(dialog,e){if(e.target!==dialog)return;const r=dialog.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)dialog.close()}
document.addEventListener('change',e=>{const sel=e.target.closest('[data-level]');if(sel){regionChanged(sel.closest('[data-location]'),sel.dataset.level)}if(e.target.name==='allCity'){document.querySelectorAll('[name="coverage"]').forEach(c=>c.disabled=e.target.checked)}});
document.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.hasAttribute('data-map-province')){e.preventDefault();e.target.dispatchEvent(new MouseEvent('click',{bubbles:true}))}});
document.addEventListener('click',e=>{
const mapPath=e.target.closest('[data-map-province]');if(mapPath){const p=mapPath.dataset.mapProvince,pr=provinceBy(p),l={province:p,city:(['11','12','31','50'].includes(p)||pr?.kind==='sar')?citiesFor(p)[0]?.code||'':'',county:''};updateLocation(mapModal.querySelector('[data-location="map-picker"]'),l);syncMap();return}
const b=e.target.closest('button');if(!b)return;
if(b.dataset.map){openMap(b.dataset.map);return}
if(b.hasAttribute('data-map-close')){mapModal.close();return}
if(b.dataset.mapCity){const field=mapModal.querySelector('[data-location="map-picker"]'),l=readLocation(field);l.city=b.dataset.mapCity;l.county='';updateLocation(field,l);syncMap();return}
if(b.hasAttribute('data-map-confirm')){const field=mapModal.querySelector('[data-location="map-picker"]'),l=readLocation(field),target=document.querySelector(`[data-location="${mapTarget}"]`);if(field.querySelector('[name="province"]').required&&!validLocation(l)){toast('请完整选择省级地区、城市和区县。');return}if(target){updateLocation(target,l);if(mapTarget==='profile-location')renderCoverage();if(mapTarget==='search-location')document.querySelector('#location-summary').textContent=locationText(l,true)}mapModal.close();return}
if(b.dataset.view)go(b.dataset.view);
else if(b.dataset.section){if(view!=='home')go('home');document.getElementById(b.dataset.section).scrollIntoView({behavior:'smooth'})}
else if(b.dataset.category){go('employer');selected=b.dataset.category;filter()}
else if(b.hasAttribute('data-filter')){selected=b.dataset.filter;filter()}
else if(b.hasAttribute('data-reset')){selected='';document.querySelector('#search').reset();updateLocation(document.querySelector('[data-location="search-location"]'),{});document.querySelector('#location-summary').textContent='全国';filter()}
else if(b.dataset.profile)profile(+b.dataset.profile);
else if(b.dataset.book)book(+b.dataset.book);
else if(b.hasAttribute('data-request'))request();
else if(b.dataset.job)jobDetail(+b.dataset.job);
else if(b.dataset.apply)apply(+b.dataset.apply);
else if(b.dataset.contact)contact(b.dataset.contact);
else if(b.dataset.tab){tab=b.dataset.tab;if(tab==='jobs')render();else dashboard(tab)}
else if(b.dataset.etab){if(b.dataset.etab==='professionals')render();else dashboard(b.dataset.etab,true)}
else if(b.hasAttribute('data-close')||b.classList.contains('close'))modal.close();
else if(b.dataset.auth)open(b.dataset.auth,`<div class="modalbody"><p>当前原型无需账号即可体验。</p><div class="infoline" style="margin-top:20px">选择一种角色开始浏览。真实注册与登录暂未开发。</div><div class="portals" style="padding:0;margin-top:20px"><button class="btn" data-auth-role="employer">以服务需求方身份体验</button><button class="btn" data-auth-role="employee">以服务人员身份体验</button></div></div>`);
else if(b.dataset.authRole){modal.close();go(b.dataset.authRole)}
else if(b.hasAttribute('data-review'))open('体验服务评价',`<form id="review-form"><div class="modalbody"><label>服务人员<select name="person">${people.map(p=>`<option>${p.name}</option>`).join('')}</select></label><label style="margin-top:15px">评分<select name="rating"><option>5分 — 非常满意</option><option>4分 — 满意</option><option>3分 — 一般</option><option>2分 — 不太满意</option><option>1分 — 不满意</option></select></label><label style="margin-top:15px">评价内容<textarea name="review" required></textarea></label><p class="small muted" style="margin-top:15px">表单仅供体验，不会改变模拟人员的评分。</p></div>${footerBtns('<button class="btn">提交模拟评价</button>')}</form>`)
});
document.addEventListener('submit',e=>{
e.preventDefault();const f=e.target,d=new FormData(f);
if(f.id==='search'){selected='';filter()}
else if(f.id==='booking-form'){
const p=people.find(p=>p.id===+f.dataset.id),l=readLocation(f.querySelector('[data-location]'));
if(!validLocation(l)){toast('请完整选择服务地点。');return}
if(!matchesLocation(p,l,true)){toast('所选地点不在该人员的服务范围内，请调整地点或选择其他人员。');return}
const day=new Date(d.get('date')+'T12:00:00').getDay(),start=d.get('time'),toMinutes=s=>Number(s.split(':')[0])*60+Number(s.split(':')[1]),range=p.time.split('–'),endMinutes=toMinutes(start)+(p.unit==='小时'?Number(d.get('duration'))*60:0);
if(d.get('date')<today){toast('请选择今天或以后的日期。');return}
if(!p.days.includes(day)||toMinutes(start)<toMinutes(range[0])||endMinutes>toMinutes(range[1])){toast('请选择人员可用日期及时间范围内的服务时段。');return}
bookings.push({name:p.name,date:d.get('date'),time:start,duration:+d.get('duration'),unit:p.unit,location:l,address:d.get('address'),notes:d.get('notes'),total:p.rate*Number(d.get('duration'))});
success('预约需求已提交。',`已保存向${p.name}发出的模拟预约，预计费用¥${p.rate*Number(d.get('duration'))}。可在「服务需求方 → 预约记录」查看。`)
}
else if(f.id==='request-form'){
const l=readLocation(f.querySelector('[data-location]'));if(!validLocation(l)){toast('请完整选择省级地区、城市和区县。');return}
if(d.get('frequency')==='recurring'&&!String(d.get('days')).trim()){toast('请填写周期服务的具体安排。');return}
if(d.get('date')<today){toast('请选择今天或以后的开始日期。');return}
const j={id:Date.now(),title:d.get('service')+'：'+d.get('recipient'),service:d.get('service'),location:l,address:d.get('address'),rate:Number(d.get('budget')),unit:d.get('unit'),schedule:d.get('frequency'),days:d.get('days')||d.get('date'),time:d.get('time'),employer:'我',skills:[d.get('service')],requirements:d.get('requirements'),desc:d.get('description'),recipient:d.get('recipient'),duration:Number(d.get('duration')),date:d.get('date')};
jobs.unshift(j);requests.push(j);success('服务需求已发布。',`你的${esc(j.service)}需求已出现在「服务人员 → 找工作」中，也可在「服务需求方 → 我的需求」查看。`)
}
else if(f.id==='message-form'){messages.push({to:f.dataset.name,text:d.get('text')});let el=document.createElement('div');el.className='message mine';el.textContent=d.get('text');document.querySelector('#conversation').appendChild(el);f.reset();toast('模拟消息已保存，不会向外部发送。')}
else if(f.id==='profile-form'){
const l=readLocation(f.querySelector('[data-location]')),coverage=d.get('allCity')==='on'?'all':d.getAll('coverage');
if(!validLocation(l)){toast('请完整选择所在地。');return}
if(coverage!=='all'&&!coverage.length){toast('请选择至少一个可服务区县，或勾选全市可服务。');return}
if(coverage!=='all'&&!coverage.every(code=>countiesFor(l.province,l.city).some(c=>c.code===code))){toast('服务范围需属于所选城市。');return}
profileDraft={name:d.get('name'),about:d.get('about'),rate:Number(d.get('rate')),location:l,coverage};toast('资料与服务范围已保存到当前会话。')
}
else if(f.id==='availability-form'){availability=d.getAll('day').map(Number);toast('每周可用时间已保存。')}
else if(f.id==='review-form')success('模拟评价已提交。','表单已接受，公开人员评价仍为示例数据。')
});
modal.addEventListener('click',e=>closeOnBackdrop(modal,e));
mapModal.addEventListener('click',e=>closeOnBackdrop(mapModal,e));

render();
